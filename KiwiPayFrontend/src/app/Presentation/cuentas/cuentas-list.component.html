<div>
  <h2>Cuentas</h2>
  <div>
    <label>Seleccionar cliente</label>
    <select [(ngModel)]="selectedClienteId">
      <option [ngValue]="undefined">-- elegir --</option>
      <option *ngFor="let c of clientes" [ngValue]="c.clienteId">{{c.nombre}} {{c.apellido}}</option>
    </select>
    <button (click)="cargarCuentas()">Cargar</button>
    <button (click)="crearCuenta()">Crear cuenta</button>
  </div>

  <table *ngIf="cuentas.length">
    <thead><tr><th>ID</th><th>Número</th><th>Saldo</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>
      <tr *ngFor="let cu of cuentas">
        <td>{{cu.cuentaId}}</td>
        <td>{{cu.numeroCuenta}}</td>
        <td>{{cu.saldo}}</td>
        <td>{{cu.estado ? 'Activa' : 'Inactiva'}}</td>
        <td><button (click)="abrirTransaccion(cu.cuentaId)">Transaccion</button></td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!cuentas.length">No hay cuentas.</div>
</div>
